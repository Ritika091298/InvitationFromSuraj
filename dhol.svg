<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 150 150" width="150" height="150">
  <!-- ===== dancing woman (left) ===== -->
  <!-- flared lehenga -->
  <path d="M20 140 Q42 128 64 140 L54 96 Q42 90 30 96 Z" fill="#c0243c" stroke="#8c1c2b" stroke-width="1.6"/>
  <path d="M20 140 Q42 129 64 140" fill="none" stroke="#d6a63a" stroke-width="3.5"/>
  <!-- torso -->
  <path d="M34 96 q8 -6 16 0 L46 74 q-4 -3 -8 0 Z" fill="#8c1c2b"/>
  <!-- raised arm with dupatta -->
  <path d="M40 78 L26 60" stroke="#e7b48c" stroke-width="4" stroke-linecap="round"/>
  <path d="M46 80 L60 62" stroke="#e7b48c" stroke-width="4" stroke-linecap="round"/>
  <path d="M26 60 Q40 52 60 62" fill="none" stroke="#d6a63a" stroke-width="3"/>
  <!-- head -->
  <circle cx="42" cy="64" r="11" fill="#e7b48c" stroke="#8a5a3b" stroke-width="1.3"/>
  <path d="M31 64 Q31 50 42 50 Q53 50 53 64 Q48 57 42 57 Q36 57 31 64 Z" fill="#241812"/>
  <circle cx="42" cy="54" r="1.6" fill="#8c1c2b"/>

  <!-- ===== dancing man (right) ===== -->
  <!-- kurta -->
  <path d="M86 140 Q104 132 122 140 L116 92 Q104 86 92 92 Z" fill="#f4e7c6" stroke="#b5852a" stroke-width="1.6"/>
  <path d="M104 92 V140" stroke="#d6a63a" stroke-width="1.4"/>
  <!-- raised arms (dandiya) -->
  <path d="M96 96 L82 78" stroke="#e7b48c" stroke-width="4" stroke-linecap="round"/>
  <path d="M112 96 L126 78" stroke="#e7b48c" stroke-width="4" stroke-linecap="round"/>
  <path d="M80 80 l-4 -8 M128 80 l4 -8" stroke="#d6a63a" stroke-width="3" stroke-linecap="round"/>
  <!-- head + turban -->
  <circle cx="104" cy="70" r="11" fill="#e7b48c" stroke="#8a5a3b" stroke-width="1.3"/>
  <path d="M93 66 Q92 52 104 52 Q116 52 115 66 Q106 58 93 66 Z" fill="#c0243c" stroke="#d6a63a" stroke-width="1.4"/>
  <path d="M104 74 q6 4 6 -1" fill="none" stroke="#6b4326" stroke-width="1.3" stroke-linecap="round"/>

  <!-- musical notes -->
  <g fill="#8c1c2b" stroke="#8c1c2b" stroke-width="1.2">
    <circle cx="72" cy="26" r="3.4"/><circle cx="82" cy="20" r="3.4"/>
    <path d="M75 26 V10 M85 20 V6 M75 10 h10 V6" fill="none"/>
  </g>
</svg>
